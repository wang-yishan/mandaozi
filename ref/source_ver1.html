  --sidebar: #FFFFFF;
  --modal: #FFFFFF;
  --input: #FFFFFF;
  --input-border: #E8E3D9;
  --chart-track: #E8E3D9;
  --success: #2E9E6B;
  --success-bg: #E8F6EF;
  --shadow: 0 10px 30px rgba(32,33,36,.07);
  --shadow-sm: 0 4px 14px rgba(32,33,36,.06);
}

[data-theme="dark"] {
  --bg: #26282E;
  --outer: #23252B;
  --surface: #30333A;
  --surface-2: #2E3037;
  --inner: #373A42;
  --border: #42454E;
  --border-strong: #4A4D56;
  --text: #F2EFE9;
  --muted: #B0ABA2;
  --placeholder: #8A857C;
  --primary: #E86060;
  --primary-dark: #D94F4F;
  --accent: #F07A6A;
  --accent-soft: #4A2E2E;
  --pill-bg: #4A2E2E;
  --pill-text: #FF9A8A;
  --nav: #2E3037;
  --sidebar: #2A2C31;
  --modal: #30333A;
  --input: #373A42;
  --input-border: #4A4D56;
  --chart-track: #42454E;
  --success: #58C48D;
  --success-bg: #2E4A3A;
  --shadow: 0 14px 32px rgba(0,0,0,.28);
  --shadow-sm: 0 4px 14px rgba(0,0,0,.22);
}

* {
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--outer);
  color: var(--text);
}

.font-hanzi {
  font-family: 'Noto Sans SC', 'Plus Jakarta Sans', sans-serif;
}

* {
  transition: background-color .25s ease, border-color .25s ease, color .25s ease;
}

.no-scrollbar::-webkit-scrollbar {
  display: none;
}

.no-scrollbar {
  scrollbar-width: none;
}

.bar-anim {
  transition: height .45s cubic-bezier(.2,.8,.2,1), background-color .25s;
}

input::-moz-placeholder {
  color: var(--placeholder);
}

input::placeholder {
  color: var(--placeholder);
}

button:focus-visible, a:focus-visible, input:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.disabled\:opacity-50:disabled{
  opacity: 0.5;
}

.disabled\:opacity-60:disabled{
  opacity: 0.6;
}

@media (min-width: 640px){

  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-3{
    padding-left: 0.75rem;

  }

  .sm\:px-5{

  }

  .sm\:text-\[12px\]{

  }

  }

  .sm\:text-\[84px\]{
    font-size: 84px;
  }
}

@media (min-width: 768px){

    display: flex;
  }
