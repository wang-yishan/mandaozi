@media (prefers-color-scheme: dark){
  :root{
    --bg:#1A1A1C;
    --surface:#262628;
    --surface2:#2B2B2D;
    --ink:#FAF8F2;
    --muted:#B7B0A8;
    --primary:#E45E4F;
    --primary-dark:#C83C3C;
    --primary-soft:#3A2323;
    --vermillion:#E45E4F;
    --bar:#3A2E2E;
    --line:#383735;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Nunito',ui-sans-serif,system-ui,sans-serif
}

button,input{
  font-family:inherit
}

button{
  cursor:pointer
}

.hanzi{
  font-family:'Noto Serif SC',serif
}

.pinyin{
  font-style:italic;
  color:var(--muted)
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 6px 22px rgba(32,33,36,.06)
}

.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:8px 13px;
  font-size:13px;
  font-weight:800;
  color:var(--ink)
}

.chip.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary)
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  border:0;
  border-radius:14px;
  padding:14px 18px;
  font-weight:900;
  font-size:15px;
  min-height:48px;
  width:100%;
  box-shadow:0 8px 20px rgba(200,60,60,.22)
}

.btn-primary:active{
  transform:translateY(1px)
}

.btn-ghost{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  font-weight:800;
  min-height:48px;
  color:var(--ink)
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

@keyframes pulseDot{
  0%,100%{
    transform:scale(1);
    opacity:1
  }

  50%{
    transform:scale(1.35);
    opacity:.65
  }
}

@keyframes pop{
  0%{
    transform:scale(.92)
  }

  100%{
    transform:scale(1)
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-6px)
  }
}

@keyframes confetti{
  0%{
    transform:translateY(0) scale(1);
    opacity:1
  }

  100%{
    transform:translateY(-34px) scale(1.1);
    opacity:0
  }
}

.pop{
  animation:pop .18s ease
}

.floaty{
  animation:floaty 2.6s ease-in-out infinite
}

input:focus,button:focus-visible{
  outline:3px solid rgba(200,60,60,.35);
  outline-offset:2px
}

input{
  border-color:var(--line)
}

/* ---------- Responsive layers (mobile <=430px unchanged) ---------- */

.responsive-layout{
  display:block;
  min-width:0
}

.responsive-main-wrap{
  display:block;
  min-width:0
}

.responsive-main{
  margin:0 auto;
  max-width:430px;
  min-height:100dvh;
  background:var(--bg);
  box-shadow:0 0 40px rgba(0,0,0,.10);
  position:relative;
  min-width:0
}

.tablet-header{
  display:none
}

.desktop-sidebar{
  display:none
}

.desktop-right{
  display:none
}

.bottom-nav{
  width:100%;
  max-width:430px
}

.onboarding-shell{
  margin-left:auto;
  margin-right:auto;
  max-width:430px
}

.sidebar-link{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:48px;
  padding:10px 12px;
  border-radius:14px;
  font-weight:800;
  font-size:15px;
  color:var(--muted);
  background:transparent;
  border:0;
  text-align:left
}

.sidebar-link.active{
  background:var(--primary-soft);
  color:var(--primary);
  box-shadow:inset 3px 0 0 var(--primary)
}

.sidebar-link:hover{
  background:var(--primary-soft);
  color:var(--ink)
}

.desktop-right .card{
  border-radius:20px
}

@media (min-width:431px){
  .responsive-main{
    max-width:920px;
    border-radius:24px;
    box-shadow:0 12px 40px rgba(32,33,36,.10);
    overflow-x:clip
  }

  .bottom-nav{
    max-width:920px;
    border-radius:24px 24px 0 0;
    overflow:hidden
  }

  .tablet-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 16px 4px;
    background:var(--bg);
    position:sticky;
    top:var(--safe-area-inset-top);
    z-index:20
  }

  .tablet-header input{
    min-width:0
  }
}

@media (min-width:640px){
  .home-columns{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important
  }

  .stats-grid{
    grid-template-columns:repeat(4,minmax(0,1fr))!important
  }

  .dict-grid{
    grid-template-columns:repeat(2,minmax(0,1fr))!important
  }

  .practice-grid{
    grid-template-columns:repeat(2,minmax(0,1fr))!important
  }

  .world-grid{
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px
  }

  .world-grid>div{
    justify-content:stretch!important;
    margin-bottom:0!important
  }

  .world-grid>div>button{
    width:100%!important
  }

  .rec-grid{
    grid-template-columns:repeat(2,minmax(0,1fr))!important
  }
}

@media (min-width:768px){
  .profile-stats-grid{
    grid-template-columns:repeat(4,minmax(0,1fr))!important
  }

  .achievements-grid{
    grid-template-columns:repeat(4,minmax(0,1fr))!important
  }

  .lesson-shell{
    max-width:640px!important
  }
}

@media (min-width:1024px){
  .responsive-layout{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    max-width:1440px;
    margin:0 auto;
    gap:0
  }

  .desktop-sidebar{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:260px;
    flex:0 0 260px;
    align-self:flex-start;
    position:sticky;
    top:var(--safe-area-inset-top);
    height:calc(100dvh - var(--safe-area-inset-top));
    background:#FFFFFF;
    border-right:1px solid var(--line);
    padding:22px 18px;
    overflow-y:auto
  }

  .tablet-header{
    display:none
  }

  .responsive-main-wrap{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:24px;
    flex:1 1 auto;
    min-width:0;
    padding:20px 20px 32px
  }

  .responsive-main{
    max-width:760px;
    width:100%;
    flex:1 1 auto;
    min-height:0;
    border-radius:24px
  }

  .responsive-main main{
    padding-left:20px!important;
    padding-right:20px!important
  }

  .bottom-nav{
    display:none!important
  }

  .lesson-next{
    bottom:16px!important
  }

  .onboarding-shell{
    max-width:520px!important;
    border-radius:28px;
    box-shadow:0 16px 48px rgba(32,33,36,.12);
    min-height:0!important;
    margin-top:28px;
    margin-bottom:28px
  }

  .onboarding-page{
    align-items:center!important
  }

  .dict-detail-backdrop{
    align-items:center!important;
    justify-items:center!important;
    padding:24px!important
  }

  .dict-detail-panel{
    border-radius:28px!important;
    max-width:640px!important
  }
}

@media (min-width:1280px){
  .desktop-right{
    display:block;
    width:300px;
    flex:0 0 300px;
    align-self:flex-start;
    position:sticky;
    top:calc(var(--safe-area-inset-top) + 20px)
  }
}

@media (hover:hover){
  .chip:hover,.card:hover{
    transform:translateY(-1px)
  }

  .btn-primary:hover{
    filter:brightness(.96)
  }
}

.active\:scale-\[0\.97\]:active{
  --tw-scale-x: 0.97;
  --tw-scale-y: 0.97;

@media (min-width: 640px){
  .sm\:inline{
    display: inline;
  }

  .sm\:w-\[62\%\]{
    width: 62%;
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:gap-3{

  }

  .sm\:rounded-\[28px\]{
    border-radius: 28px;
  }

  .sm\:p-4{
